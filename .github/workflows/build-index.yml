name: build-index

# index.json is a BUILD ARTIFACT, not a hand-edited file. Contributors (and the
# future Discord bot) add only a .prefab + its .meta.json sidecar; this job
# regenerates index.json on merge to main and commits it back if it changed.
# That keeps contributor PRs conflict-free — they never touch the shared
# manifest. The push is made with GITHUB_TOKEN, which does not re-trigger
# workflows, so there is no commit loop (the actor guard + [skip ci] are belt
# and suspenders).

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build-index:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Regenerate index.json
        run: python tools/gen_index.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- index.json; then
            echo "index.json already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.json
            git commit -m "chore: regenerate index.json [skip ci]"
            git push
          fi
